<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111518">
  <title>Gridlock | Tic Tac Toe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wallpaper" aria-hidden="true"></div>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="." aria-label="Gridlock home">
        <span class="brand-mark">+</span>
        <span>GRIDLOCK</span>
      </a>
      <div class="topbar-note"><span class="live-dot"></span> LOCAL GAME / NO SCOREBOARD</div>
    </header>

    <section class="game-layout" aria-label="Tic tac toe game">
      <aside class="intro-panel">
        <p class="eyebrow">A SMALL GAME OF</p>
        <h1>Three in<br><em>a row.</em></h1>
        <p class="intro-copy">Read the grid. Find the opening. Leave your mark.</p>
        <div class="mode-switch" role="group" aria-label="Choose game mode">
          <button class="mode-button active" data-mode="cpu" type="button">VS CPU</button>
          <button class="mode-button" data-mode="local" type="button">2 PLAYERS</button>
        </div>
        <div class="scoreboard" aria-label="Scoreboard">
          <div class="score-item score-x"><span class="score-label">YOU <b class="player-x">X</b></span><strong id="scoreX">0</strong></div>
          <div class="score-divider">:</div>
          <div class="score-item score-o"><span class="score-label"><b class="player-o">O</b> <span id="opponentLabel">CPU</span></span><strong id="scoreO">0</strong></div>
        </div>
      </aside>

      <section class="play-panel">
        <div class="round-header">
          <div>
            <p class="eyebrow">ROUND <span id="roundNumber">01</span></p>
            <h2 id="statusText">Your move</h2>
          </div>
          <button class="icon-button" id="newGameButton" type="button" aria-label="Start a new game" title="New game">↻</button>
        </div>
        <div class="board-wrap">
          <div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div>
          <div class="winner-line" id="winnerLine" aria-hidden="true"></div>
        </div>
        <div class="play-footer">
          <span id="turnHint">X starts every round</span>
          <button class="text-button" id="resetScoreButton" type="button">Reset score <span>↗</span></button>
        </div>
      </section>
    </section>

    <footer class="footer"><span>GRIDLOCK 2026</span><span>MAKE YOUR MOVE</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
